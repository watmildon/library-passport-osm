name: Update library systems list

# Refresh data/us-library-systems.json from OpenStreetMap US's Layercake POI
# extract so the onboarding picker reflects mappers' latest additions and
# cleanups. Layercake is queried directly over HTTP with DuckDB (no full
# download) and, unlike QLever, does not block GitHub Actions runner IPs.

on:
  schedule:
    # Sundays 09:17 UTC — Layercake refreshes on Saturday, so this reliably
    # picks up the new snapshot. (If it ever ran early, the freshness gate skips.)
    - cron: '17 9 * * 0'
  workflow_dispatch:         # allow manual runs from the Actions tab
    inputs:
      force:
        description: 'Rebuild even if Layercake has not published a newer snapshot'
        type: boolean
        default: false

# Let the job commit back to the repo.
permissions:
  contents: write

concurrency:
  group: update-systems
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Record current counts
        id: before
        run: |
          OLD=$(node -p "require('./data/us-library-systems.json').systems.length")
          echo "count=$OLD" >> "$GITHUB_OUTPUT"
          OLD_QA=$(node -p "try { require('./data/qa-data.json').libs.length } catch { 0 }")
          echo "qacount=$OLD_QA" >> "$GITHUB_OUTPUT"
          echo "Currently committed: $OLD systems, $OLD_QA QA libraries."

      - name: Freshness gate
        id: gate
        run: |
          # Layercake is rebuilt periodically from OSM. Skip the whole rebuild when
          # our committed data already comes from an equal-or-newer source (each
          # data file records meta.sourceDate). This also avoids clobbering a
          # fresher out-of-band refresh (e.g. a manual Overpass run).
          LIVE=$(curl -sfI "https://data.openstreetmap.us/layercake/pois.parquet" \
                 | grep -i '^last-modified:' | sed 's/^[Ll]ast-[Mm]odified: //' | tr -d '\r' || echo "")
          LIVE_DATE=$(node -e "const t=Date.parse(process.argv[1]); process.stdout.write(Number.isNaN(t)?'':new Date(t).toISOString().slice(0,10))" "$LIVE" 2>/dev/null || echo "")
          SYS=$(node -p "const m=require('./data/us-library-systems.json').meta; m.sourceDate||''" 2>/dev/null || echo "")
          QA=$(node -p "const m=require('./data/qa-data.json').meta; m.sourceDate||''" 2>/dev/null || echo "")
          echo "Layercake live: '${LIVE:-unknown}' (${LIVE_DATE:-?})"
          echo "Committed sourceDate — systems: '${SYS:-none}', qa: '${QA:-none}'"
          echo "### Data source" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenStreetMap US Layercake \`pois.parquet\` — live: ${LIVE:-unknown}" >> "$GITHUB_STEP_SUMMARY"

          RUN=yes
          # Skip only if BOTH committed files are already at least as fresh as live.
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Forced rebuild requested."
          elif [ -n "$LIVE_DATE" ] && [ -n "$SYS" ] && [ -n "$QA" ] \
               && [ ! "$SYS" \< "$LIVE_DATE" ] && [ ! "$QA" \< "$LIVE_DATE" ]; then
            echo "Committed data is not older than the live Layercake snapshot — skipping rebuild."
            echo "Up to date (committed sourceDate >= Layercake ${LIVE_DATE})." >> "$GITHUB_STEP_SUMMARY"
            RUN=no
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Regenerate systems list
        if: steps.gate.outputs.run == 'yes'
        run: |
          duckdb --version
          node scripts/build-systems.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Regenerate QA dataset
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/build-qa.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Sanity-check the results
        if: steps.gate.outputs.run == 'yes'
        env:
          OLD: ${{ steps.before.outputs.count }}
          OLD_QA: ${{ steps.before.outputs.qacount }}
        run: |
          NEW=$(node -p "require('./data/us-library-systems.json').systems.length")
          NEW_QA=$(node -p "require('./data/qa-data.json').libs.length")
          echo "Generated $NEW systems (was $OLD), $NEW_QA QA libraries (was $OLD_QA)."

          # Guard against a broken/empty upstream response gutting either file.
          if [ "$NEW" -lt 1000 ]; then
            echo "::error::Only $NEW systems generated (expected >= 1000). Refusing to commit."
            exit 1
          fi
          if [ "$NEW_QA" -lt 10000 ]; then
            echo "::error::Only $NEW_QA QA libraries generated (expected >= 10000). Refusing to commit."
            exit 1
          fi

          # Refuse a >20% swing in either direction — almost always an upstream
          # data glitch rather than a week of real mapping activity.
          check_band() {  # name old new
            if [ "$2" -gt 0 ]; then
              LOW=$(( $2 * 80 / 100 )); HIGH=$(( $2 * 120 / 100 ))
              if [ "$3" -lt "$LOW" ] || [ "$3" -gt "$HIGH" ]; then
                echo "::error::$1 count changed from $2 to $3 (>20%). Refusing to commit; re-run manually if this is a real change."
                exit 1
              fi
            fi
          }
          check_band "System" "$OLD" "$NEW"
          check_band "QA library" "$OLD_QA" "$NEW_QA"

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/us-library-systems.json data/qa-data.json; then
            echo "No changes to the data files."
            exit 0
          fi
          COUNT=$(node -p "require('./data/us-library-systems.json').systems.length")
          git add data/us-library-systems.json data/qa-data.json
          git commit -m "chore: weekly refresh of library data ($COUNT systems)"
          git push
