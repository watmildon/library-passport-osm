name: Update library data

# Refresh data/us-library-systems.json, data/ca-library-systems.json and
# data/qa-data.json daily from the private Overpass instance (minutely OSM
# replication), so the picker and the QA page keep pace with mappers' work. The instance URL is the
# OVERPASS_PRIMARY_URL repository secret; the scripts read it as OVERPASS_URL
# and are careful never to print it (GitHub only masks the exact secret string,
# so even the hostname would leak).
#
# FAILOVER: when the primary instance is down, the freshness gate walks the
# endpoint chain – the OVERPASS_SECONDARY_URL secret (a hosted fallback with a
# tight quota), then the public Overpass servers – and pins the winner for the
# rest of the job via the OVERPASS_TIER env var. Any tier but primary runs a
# DEGRADED refresh: the systems lists and the QA basics are rebuilt, while the
# expensive stages (per-system augment fetches, unnamed-pair outlines) are
# skipped and their sections carried forward from the last full refresh. Like
# the primary, the secondary URL may embed an API key and is never logged.
#
# The Canadian outlet census (data/ca-library-outlets.json) is NOT refreshed
# here: its provincial and municipal open-data portals move only a few times a
# year and rate-limit daily polling — a data.ontario.ca 429 broke this job on
# 2026-08-28. It has its own monthly workflow (update-ca-outlets.yml); this job
# only reads the committed file.
#
# The Layercake/DuckDB build path still exists as a manual fallback — see
# scripts/README.md.

on:
  schedule:
    - cron: '17 9 * * *'       # daily; the freshness gate makes reruns no-ops
  workflow_dispatch:           # allow manual runs from the Actions tab
    inputs:
      force:
        description: 'Rebuild even if the committed data is already up to date'
        type: boolean
        default: false
      tier:
        description: 'Pin the refresh to one endpoint tier (auto walks the failover chain)'
        type: choice
        options: [auto, primary, secondary, public]
        default: auto

# Let the job commit back to the repo.
permissions:
  contents: write

concurrency:
  group: update-systems
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OVERPASS_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}
      OVERPASS_SECONDARY_URL: ${{ secrets.OVERPASS_SECONDARY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Record current counts
        id: before
        run: |
          OLD=$(node -p "require('./data/us-library-systems.json').systems.length")
          echo "count=$OLD" >> "$GITHUB_OUTPUT"
          OLD_CA=$(node -p "try { require('./data/ca-library-systems.json').systems.length } catch { 0 }")
          echo "cacount=$OLD_CA" >> "$GITHUB_OUTPUT"
          OLD_QA=$(node -p "try { require('./data/qa-data.json').libs.length } catch { 0 }")
          echo "qacount=$OLD_QA" >> "$GITHUB_OUTPUT"
          OLD_CAQA=$(node -p "try { require('./data/ca-qa-data.json').libs.length } catch { 0 }")
          echo "caqacount=$OLD_CAQA" >> "$GITHUB_OUTPUT"
          echo "Currently committed: $OLD US systems, $OLD_CA CA systems, $OLD_QA US QA libraries, $OLD_CAQA CA QA libraries."

      - name: Freshness gate
        id: gate
        run: |
          # Asks the instance for its data timestamp and skips the whole rebuild
          # when every committed file already comes from an equal-or-newer
          # snapshot. The decision, the tracked-file list, the failover walk and
          # the failure diagnosis all live in the script — it shares them with
          # the build scripts it gates, and it never echoes an endpoint. When a
          # fallback tier wins, the gate pins it for the later steps by writing
          # OVERPASS_TIER to $GITHUB_ENV.
          node scripts/freshness-gate.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }} --tier=${{ github.event.inputs.tier || 'auto' }}

      - name: Check whether a new IMLS PLS release needs DuckDB
        id: pls
        if: steps.gate.outputs.run == 'yes'
        run: |
          # build-pls.mjs self-gates on its PLS_FY constant and only invokes
          # DuckDB when a new fiscal-year release must be ingested — which
          # happens about once a year, right after PLS_FY is bumped in a commit.
          NEED=$(node -e "
            const fs = require('fs');
            const fy = (fs.readFileSync('scripts/build-pls.mjs','utf8').match(/const PLS_FY = '(\d+)'/) || [])[1];
            let cur = null; try { cur = require('./data/pls-outlets.json').meta.fiscalYear } catch {}
            process.stdout.write(fy && fy !== cur ? 'yes' : 'no');
          ")
          echo "PLS ingest needed: $NEED"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Install DuckDB CLI (new PLS release only)
        if: steps.gate.outputs.run == 'yes' && steps.pls.outputs.need == 'yes'
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Regenerate US systems list (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/refresh-systems.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Regenerate Canada systems list (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/refresh-systems.mjs --country=CA ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Refresh IMLS PLS data
        if: steps.gate.outputs.run == 'yes'
        run: |
          # Self-gates on fiscal year — a no-op unless a new PLS release is out.
          node scripts/build-pls.mjs

      - name: Regenerate US QA dataset (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/build-qa.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Regenerate Canada QA dataset (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/build-qa.mjs --country=CA ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Sanity-check the results
        if: steps.gate.outputs.run == 'yes'
        env:
          OLD: ${{ steps.before.outputs.count }}
          OLD_CA: ${{ steps.before.outputs.cacount }}
          OLD_QA: ${{ steps.before.outputs.qacount }}
          OLD_CAQA: ${{ steps.before.outputs.caqacount }}
        run: |
          NEW=$(node -p "require('./data/us-library-systems.json').systems.length")
          NEW_CA=$(node -p "try { require('./data/ca-library-systems.json').systems.length } catch { 0 }")
          NEW_QA=$(node -p "require('./data/qa-data.json').libs.length")
          NEW_CAQA=$(node -p "try { require('./data/ca-qa-data.json').libs.length } catch { 0 }")
          echo "Generated $NEW US systems (was $OLD), $NEW_CA CA systems (was $OLD_CA), $NEW_QA US QA libraries (was $OLD_QA), $NEW_CAQA CA QA libraries (was $OLD_CAQA)."

          # Guard against a broken/empty upstream response gutting any file.
          if [ "$NEW" -lt 1000 ]; then
            echo "::error::Only $NEW US systems generated (expected >= 1000). Refusing to commit."
            exit 1
          fi
          if [ "$NEW_CA" -lt 100 ]; then
            echo "::error::Only $NEW_CA CA systems generated (expected >= 100). Refusing to commit."
            exit 1
          fi
          if [ "$NEW_QA" -lt 10000 ]; then
            echo "::error::Only $NEW_QA US QA libraries generated (expected >= 10000). Refusing to commit."
            exit 1
          fi
          if [ "$NEW_CAQA" -lt 1000 ]; then
            echo "::error::Only $NEW_CAQA CA QA libraries generated (expected >= 1000). Refusing to commit."
            exit 1
          fi

          # Refuse a >20% swing in either direction — almost always an upstream
          # data glitch rather than a day of real mapping activity.
          check_band() {  # name old new
            if [ "$2" -gt 0 ]; then
              LOW=$(( $2 * 80 / 100 )); HIGH=$(( $2 * 120 / 100 ))
              if [ "$3" -lt "$LOW" ] || [ "$3" -gt "$HIGH" ]; then
                echo "::error::$1 count changed from $2 to $3 (>20%). Refusing to commit; re-run manually if this is a real change."
                exit 1
              fi
            fi
          }
          check_band "US system" "$OLD" "$NEW"
          check_band "CA system" "$OLD_CA" "$NEW_CA"
          check_band "US QA library" "$OLD_QA" "$NEW_QA"
          check_band "CA QA library" "$OLD_CAQA" "$NEW_CAQA"

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff ignores untracked files (a country's first-ever systems
          # file), so use status --porcelain to detect changes.
          if [ -z "$(git status --porcelain -- data/us-library-systems.json data/ca-library-systems.json data/qa-data.json data/ca-qa-data.json data/pls-outlets.json)" ]; then
            echo "No changes to the data files."
            exit 0
          fi
          COUNT=$(node -p "require('./data/us-library-systems.json').systems.length")

          # What actually changed, counted per section by stable record key (see
          # scripts/data-diff-summary.mjs). Goes in the commit body so `git log`
          # shows the real size of a refresh — the raw diff is megabytes either
          # way. Must run before `git add`: it compares the tree against HEAD.
          SUMMARY=$(node scripts/data-diff-summary.mjs || true)
          echo "${SUMMARY:-No section-level changes.}"
          {
            echo "### Changes"
            echo '```'
            echo "${SUMMARY:-No section-level changes.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git add data/us-library-systems.json data/ca-library-systems.json data/qa-data.json data/ca-qa-data.json data/pls-outlets.json
          MSG=(-m "chore: daily refresh of library data ($COUNT systems)")
          # A degraded refresh says so in the commit body, so `git log` shows
          # which days ran on a fallback endpoint with stages carried forward.
          if [ "${{ steps.gate.outputs.degraded }}" = "yes" ]; then
            MSG+=(-m "Degraded refresh (${{ steps.gate.outputs.tier }} endpoint tier): augment and unnamed-pair sections carried forward.")
          fi
          if [ -n "$SUMMARY" ]; then
            MSG+=(-m "$SUMMARY")
          fi
          git commit "${MSG[@]}"
          git push
