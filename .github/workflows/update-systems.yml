name: Update library data

# Refresh data/us-library-systems.json and data/qa-data.json daily from the
# private Overpass instance (minutely OSM replication), so the picker and the
# QA page keep pace with mappers' work. The instance URL is the
# OVERPASS_PRIMARY_URL repository secret; the scripts read it as OVERPASS_URL
# and are careful never to print it (GitHub only masks the exact secret string,
# so even the hostname would leak).
#
# The Layercake/DuckDB build path still exists as a manual fallback — see
# scripts/README.md.

on:
  schedule:
    - cron: '17 9 * * *'       # daily; the freshness gate makes reruns no-ops
  workflow_dispatch:           # allow manual runs from the Actions tab
    inputs:
      force:
        description: 'Rebuild even if the committed data is already up to date'
        type: boolean
        default: false

# Let the job commit back to the repo.
permissions:
  contents: write

concurrency:
  group: update-systems
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OVERPASS_URL: ${{ secrets.OVERPASS_PRIMARY_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Record current counts
        id: before
        run: |
          OLD=$(node -p "require('./data/us-library-systems.json').systems.length")
          echo "count=$OLD" >> "$GITHUB_OUTPUT"
          OLD_QA=$(node -p "try { require('./data/qa-data.json').libs.length } catch { 0 }")
          echo "qacount=$OLD_QA" >> "$GITHUB_OUTPUT"
          echo "Currently committed: $OLD systems, $OLD_QA QA libraries."

      - name: Freshness gate
        id: gate
        run: |
          # Ask the Overpass instance for its data timestamp and skip the whole
          # rebuild when the committed data already comes from an equal-or-newer
          # snapshot (each data file records meta.sourceDate). Do not echo the
          # endpoint anywhere.
          if [ -z "$OVERPASS_URL" ]; then
            echo "::error::OVERPASS_PRIMARY_URL secret is not set."
            exit 1
          fi
          TS=$(curl -sf -X POST "$OVERPASS_URL" \
                 --data-urlencode 'data=[out:json][timeout:60];out count;' \
               | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).osm3s.timestamp_osm_base||'')}catch{}})" \
               || echo "")
          if [ -z "$TS" ]; then
            echo "::error::The Overpass instance did not answer with a data timestamp. Is it up?"
            exit 1
          fi
          LIVE_DATE="${TS:0:10}"
          SYS=$(node -p "const m=require('./data/us-library-systems.json').meta; m.sourceDate||''" 2>/dev/null || echo "")
          QA=$(node -p "const m=require('./data/qa-data.json').meta; m.sourceDate||''" 2>/dev/null || echo "")
          echo "Overpass data: $TS"
          echo "Committed sourceDate — systems: '${SYS:-none}', qa: '${QA:-none}'"
          echo "### Data source" >> "$GITHUB_STEP_SUMMARY"
          echo "Private Overpass instance — data timestamp: $TS" >> "$GITHUB_STEP_SUMMARY"

          RUN=yes
          # Skip only if BOTH committed files are already at least as fresh as live.
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Forced rebuild requested."
          elif [ -n "$SYS" ] && [ -n "$QA" ] \
               && [ ! "$SYS" \< "$LIVE_DATE" ] && [ ! "$QA" \< "$LIVE_DATE" ]; then
            echo "Committed data is not older than the Overpass snapshot — skipping rebuild."
            echo "Up to date (committed sourceDate >= ${LIVE_DATE})." >> "$GITHUB_STEP_SUMMARY"
            RUN=no
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Check whether a new IMLS PLS release needs DuckDB
        id: pls
        if: steps.gate.outputs.run == 'yes'
        run: |
          # build-pls.mjs self-gates on its PLS_FY constant and only invokes
          # DuckDB when a new fiscal-year release must be ingested — which
          # happens about once a year, right after PLS_FY is bumped in a commit.
          NEED=$(node -e "
            const fs = require('fs');
            const fy = (fs.readFileSync('scripts/build-pls.mjs','utf8').match(/const PLS_FY = '(\d+)'/) || [])[1];
            let cur = null; try { cur = require('./data/pls-outlets.json').meta.fiscalYear } catch {}
            process.stdout.write(fy && fy !== cur ? 'yes' : 'no');
          ")
          echo "PLS ingest needed: $NEED"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - name: Install DuckDB CLI (new PLS release only)
        if: steps.gate.outputs.run == 'yes' && steps.pls.outputs.need == 'yes'
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Regenerate systems list (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/refresh-systems.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Refresh IMLS PLS data
        if: steps.gate.outputs.run == 'yes'
        run: |
          # Self-gates on fiscal year — a no-op unless a new PLS release is out.
          node scripts/build-pls.mjs

      - name: Regenerate QA dataset (Overpass)
        if: steps.gate.outputs.run == 'yes'
        run: |
          node scripts/build-qa.mjs ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Sanity-check the results
        if: steps.gate.outputs.run == 'yes'
        env:
          OLD: ${{ steps.before.outputs.count }}
          OLD_QA: ${{ steps.before.outputs.qacount }}
        run: |
          NEW=$(node -p "require('./data/us-library-systems.json').systems.length")
          NEW_QA=$(node -p "require('./data/qa-data.json').libs.length")
          echo "Generated $NEW systems (was $OLD), $NEW_QA QA libraries (was $OLD_QA)."

          # Guard against a broken/empty upstream response gutting either file.
          if [ "$NEW" -lt 1000 ]; then
            echo "::error::Only $NEW systems generated (expected >= 1000). Refusing to commit."
            exit 1
          fi
          if [ "$NEW_QA" -lt 10000 ]; then
            echo "::error::Only $NEW_QA QA libraries generated (expected >= 10000). Refusing to commit."
            exit 1
          fi

          # Refuse a >20% swing in either direction — almost always an upstream
          # data glitch rather than a day of real mapping activity.
          check_band() {  # name old new
            if [ "$2" -gt 0 ]; then
              LOW=$(( $2 * 80 / 100 )); HIGH=$(( $2 * 120 / 100 ))
              if [ "$3" -lt "$LOW" ] || [ "$3" -gt "$HIGH" ]; then
                echo "::error::$1 count changed from $2 to $3 (>20%). Refusing to commit; re-run manually if this is a real change."
                exit 1
              fi
            fi
          }
          check_band "System" "$OLD" "$NEW"
          check_band "QA library" "$OLD_QA" "$NEW_QA"

      - name: Commit and push if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/us-library-systems.json data/qa-data.json data/pls-outlets.json; then
            echo "No changes to the data files."
            exit 0
          fi
          COUNT=$(node -p "require('./data/us-library-systems.json').systems.length")

          # What actually changed, counted per section by stable record key (see
          # scripts/data-diff-summary.mjs). Goes in the commit body so `git log`
          # shows the real size of a refresh — the raw diff is megabytes either
          # way. Must run before `git add`: it compares the tree against HEAD.
          SUMMARY=$(node scripts/data-diff-summary.mjs || true)
          echo "${SUMMARY:-No section-level changes.}"
          {
            echo "### Changes"
            echo '```'
            echo "${SUMMARY:-No section-level changes.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          git add data/us-library-systems.json data/qa-data.json data/pls-outlets.json
          if [ -n "$SUMMARY" ]; then
            git commit -m "chore: daily refresh of library data ($COUNT systems)" -m "$SUMMARY"
          else
            git commit -m "chore: daily refresh of library data ($COUNT systems)"
          fi
          git push
